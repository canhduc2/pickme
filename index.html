<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hiệu Ứng Hoa Hướng Dương 3D</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 38%, #211708 0%, #090602 100%);
      touch-action: none;
    }
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #interactionLayer {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: grab;
    }
    #interactionLayer:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="text-amber-50 relative select-none">

  <!-- 3D WebGL Sunflower Canvas -->
  <canvas id="canvas3d"></canvas>

  <!-- Touch & Mouse Gesture Layer for 3D rotation and zoom -->
  <div id="interactionLayer" aria-label="Xoay hoa 3D"></div>

  <script>
    (function () {
      'use strict';

      function ensureThreeLoaded(callback) {
        if (typeof window.THREE !== 'undefined') {
          callback();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        script.onload = callback;
        document.head.appendChild(script);
      }

      function startApp() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const state = {
          rotationY: 0,
          rotationX: 0.38,
          targetRotationY: 0,
          targetRotationX: 0.38,
          cameraZoom: isMobile ? 8.2 : 7.0,
          targetZoom: isMobile ? 8.2 : 7.0,
          isDragging: false,
          lastPointerX: 0,
          lastPointerY: 0,
          pinchDistance: 0,
          time: 0
        };

        const canvas3d = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({
          canvas: canvas3d,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2.0));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.6, state.cameraZoom);

        const ambientLight = new THREE.AmbientLight(0xfffbeb, 0.9);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfffef0, 1.25);
        keyLight.position.set(4, 8, 6);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xf59e0b, 0.6);
        fillLight.position.set(-5, 2, -4);
        scene.add(fillLight);

        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const flowerGroup = new THREE.Group();
        rootGroup.add(flowerGroup);

        const pollenGroup = new THREE.Group();
        rootGroup.add(pollenGroup);

        let animatedPetals = [];

        function createSunflowerPetalGeometry() {
          const width = 0.38;
          const length = 1.35;
          const segW = 14;
          const segL = 18;
          const geo = new THREE.PlaneGeometry(width, length, segW, segL);
          const pos = geo.attributes.position;
          const colors = new Float32Array(pos.count * 3);
          const tempColor = new THREE.Color();

          const cInner = new THREE.Color('#d97706');
          const cMid = new THREE.Color('#f59e0b');
          const cTip = new THREE.Color('#fef08a');

          for (let i = 0; i < pos.count; i++) {
            const rawX = pos.getX(i);
            const rawY = pos.getY(i);

            const u = rawX / (width * 0.5);
            const v = Math.max(0.0, Math.min(1.0, (rawY + length * 0.5) / length));

            // Natural radiant sunflower petal profile: tapering gracefully towards a pointed tip
            const sinProfile = Math.sin(Math.pow(v, 0.65) * Math.PI);
            const tipTaper = 1.0 - 0.75 * Math.pow(v, 2.4);
            const baseWidth = 0.15 * (1.0 - v);
            const widthScale = Math.max(0.04, sinProfile * tipTaper + baseWidth);

            const x = rawX * widthScale;
            const y = v * length;

            // Gentle curvature: slightly cupped base and subtle upward curl at tip
            const bowlCup = 0.08 * (1.0 - u * u) * Math.sin(v * Math.PI);
            const upperCurl = Math.pow(Math.max(0.0, v - 0.5) / 0.5, 2.2) * 0.18;
            const z = bowlCup + upperCurl;

            pos.setXYZ(i, x, y, z);

            if (v < 0.4) {
              tempColor.lerpColors(cInner, cMid, v / 0.4);
            } else {
              tempColor.lerpColors(cMid, cTip, (v - 0.4) / 0.6);
            }

            colors[i * 3] = tempColor.r;
            colors[i * 3 + 1] = tempColor.g;
            colors[i * 3 + 2] = tempColor.b;
          }

          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geo.computeVertexNormals();
          return geo;
        }

        function buildCalyx(radius, sepalLength) {
          const calyxGroup = new THREE.Group();
          const cBase = new THREE.Color('#14532d');
          const cMid = new THREE.Color('#15803d');
          const cTip = new THREE.Color('#4ade80');
          const sepalGeo = createSunflowerPetalGeometry();
          const sepalMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.5,
            side: THREE.DoubleSide
          });

          const count = 6;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const radialHolder = new THREE.Group();
            radialHolder.rotation.y = angle;

            const pivot = new THREE.Group();
            pivot.position.set(0, -0.05, radius);
            pivot.rotation.x = 1.45;

            const mesh = new THREE.Mesh(sepalGeo, sepalMat);
            mesh.scale.set(0.7, 0.6, 0.7);
            pivot.add(mesh);
            radialHolder.add(pivot);
            calyxGroup.add(radialHolder);
          }
          return calyxGroup;
        }

        function buildSunflower() {
          const headGroup = new THREE.Group();
          headGroup.position.set(0, 0.3, 0);

          // Dark brown textured seed disc center
          const discGeo = new THREE.CylinderGeometry(0.72, 0.62, 0.25, 32);
          const discMat = new THREE.MeshStandardMaterial({
            color: 0x3b1704,
            roughness: 0.9
          });
          const discMesh = new THREE.Mesh(discGeo, discMat);
          discMesh.position.y = 0.08;
          headGroup.add(discMesh);

          // Golden pollen rim around seed disc
          const rimGeo = new THREE.TorusGeometry(0.66, 0.05, 12, 32);
          const rimMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            roughness: 0.5
          });
          const rimMesh = new THREE.Mesh(rimGeo, rimMat);
          rimMesh.rotation.x = Math.PI / 2;
          rimMesh.position.y = 0.18;
          headGroup.add(rimMesh);

          const petalGeo = createSunflowerPetalGeometry();
          const sharedMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.38,
            metalness: 0.03,
            side: THREE.DoubleSide
          });

          const rings = [
            { count: 18, radius: 0.64, y: 0.12, rotOffset: 0, tilt: 1.15, scale: 0.95 },
            { count: 20, radius: 0.68, y: 0.08, rotOffset: Math.PI / 20, tilt: 1.28, scale: 1.05 }
          ];

          rings.forEach((ring, rIdx) => {
            for (let i = 0; i < ring.count; i++) {
              const angle = (i / ring.count) * Math.PI * 2 + ring.rotOffset;
              const radialHolder = new THREE.Group();
              radialHolder.rotation.y = angle;

              const pivot = new THREE.Group();
              pivot.position.set(0, ring.y, ring.radius);
              pivot.rotation.x = ring.tilt;

              const mesh = new THREE.Mesh(petalGeo, sharedMat);
              mesh.scale.setScalar(ring.scale);
              pivot.add(mesh);
              radialHolder.add(pivot);
              headGroup.add(radialHolder);

              animatedPetals.push({
                pivot,
                baseTilt: ring.tilt,
                phase: i * 0.4 + rIdx
              });
            }
          });

          headGroup.add(buildCalyx(0.52, 0.7));

          // Robust green stem with leaves
          const stemMat = new THREE.MeshStandardMaterial({
            color: 0x15803d,
            roughness: 0.55
          });
          const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.05, 0),
            new THREE.Vector3(0.04, -0.9, 0.02),
            new THREE.Vector3(-0.03, -1.8, -0.01),
            new THREE.Vector3(0, -2.8, 0)
          ]);
          const stemGeo = new THREE.TubeGeometry(curve, 20, 0.065, 12, false);
          const stemMesh = new THREE.Mesh(stemGeo, stemMat);
          headGroup.add(stemMesh);

          // Stem leaves
          const leafGeo = createSunflowerPetalGeometry();
          const leafMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.45,
            side: THREE.DoubleSide
          });

          const leaves = [
            { y: -0.8, angle: 0.7, tilt: 1.1, scale: 0.9 },
            { y: -1.5, angle: 3.5, tilt: 1.15, scale: 1.0 }
          ];

          leaves.forEach((lf) => {
            const holder = new THREE.Group();
            holder.position.set(0, lf.y, 0);
            holder.rotation.y = lf.angle;

            const pivot = new THREE.Group();
            pivot.position.set(0, 0, 0.06);
            pivot.rotation.x = lf.tilt;

            const mesh = new THREE.Mesh(leafGeo, leafMat);
            mesh.scale.setScalar(lf.scale);
            pivot.add(mesh);
            holder.add(pivot);
            headGroup.add(holder);
          });

          flowerGroup.add(headGroup);
        }

        buildSunflower();

        const pollenOrbs = [];
        function initPollenOrbs() {
          const count = isMobile ? 25 : 45;
          const geo = new THREE.SphereGeometry(0.026, 8, 8);
          for (let i = 0; i < count; i++) {
            const mat = new THREE.MeshBasicMaterial({
              color: i % 2 === 0 ? 0xfde047 : 0xfbbf24,
              transparent: true,
              opacity: 0.4 + Math.random() * 0.45
            });
            const mesh = new THREE.Mesh(geo, mat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.0 + Math.random() * 2.2;
            const y = -1.2 + Math.random() * 3.0;
            mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
            pollenGroup.add(mesh);
            pollenOrbs.push({
              mesh,
              angle,
              radius,
              baseY: y,
              speed: 0.25 + Math.random() * 0.35,
              offset: Math.random() * Math.PI * 2
            });
          }
        }
        initPollenOrbs();

        function animate() {
          requestAnimationFrame(animate);

          state.time += 0.016;

          if (!state.isDragging) {
            state.targetRotationY += 0.004;
          }
          state.rotationY += (state.targetRotationY - state.rotationY) * 0.1;
          state.rotationX += (state.targetRotationX - state.rotationX) * 0.1;
          state.cameraZoom += (state.targetZoom - state.cameraZoom) * 0.1;

          rootGroup.rotation.y = state.rotationY;
          rootGroup.rotation.x = state.rotationX;
          rootGroup.position.y = Math.sin(state.time * 1.2) * 0.05;
          camera.position.z = state.cameraZoom;

          for (let i = 0; i < animatedPetals.length; i++) {
            const p = animatedPetals[i];
            const breeze = Math.sin(state.time * 1.5 + p.phase) * 0.02;
            p.pivot.rotation.x = p.baseTilt + breeze;
          }

          for (let i = 0; i < pollenOrbs.length; i++) {
            const orb = pollenOrbs[i];
            const a = orb.angle + state.time * orb.speed * 0.3;
            orb.mesh.position.x = Math.cos(a) * orb.radius;
            orb.mesh.position.z = Math.sin(a) * orb.radius;
            orb.mesh.position.y = orb.baseY + Math.sin(state.time * 1.3 + orb.offset) * 0.2;
          }

          renderer.render(scene, camera);
        }

        const interactionLayer = document.getElementById('interactionLayer');

        interactionLayer.addEventListener('pointerdown', (e) => {
          state.isDragging = true;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
          if (!state.isDragging) return;
          const dx = e.clientX - state.lastPointerX;
          const dy = e.clientY - state.lastPointerY;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;

          state.targetRotationY += dx * 0.008;
          state.targetRotationX = Math.max(-0.4, Math.min(1.0, state.targetRotationX + dy * 0.006));
        });

        window.addEventListener('pointerup', () => {
          state.isDragging = false;
        });

        interactionLayer.addEventListener('wheel', (e) => {
          e.preventDefault();
          state.targetZoom = Math.max(4.5, Math.min(11.0, state.targetZoom + e.deltaY * 0.003));
        }, { passive: false });

        interactionLayer.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            state.pinchDistance = Math.hypot(dx, dy);
          }
        }, { passive: true });

        interactionLayer.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && state.pinchDistance > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = state.pinchDistance - dist;
            state.targetZoom = Math.max(4.5, Math.min(11.0, state.targetZoom + delta * 0.015));
            state.pinchDistance = dist;
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => ensureThreeLoaded(startApp));
      } else {
        ensureThreeLoaded(startApp);
      }
    })();
  </script>
</body>
</html>
