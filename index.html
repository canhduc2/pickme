<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hiệu Ứng Hoa Hồng Nhung 3D</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 38%, #24060d 0%, #090103 100%);
      touch-action: none;
    }
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #canvas2d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }
    #interactionLayer {
      position: fixed;
      inset: 0;
      z-index: 3;
      cursor: grab;
    }
    #interactionLayer:active {
      cursor: grabbing;
    }
    .slider-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(24, 6, 11, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(225, 29, 72, 0.32);
      padding: 10px 22px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 150px;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #e11d48;
      border: 2px solid #ffe4e6;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.9);
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body class="text-rose-100 relative select-none">

  <!-- 3D WebGL Spiral Rose Canvas -->
  <canvas id="canvas3d"></canvas>

  <!-- 2D Falling Velvet Rose Petals & Bokeh Overlay -->
  <canvas id="canvas2d"></canvas>

  <!-- Touch & Mouse Gesture Layer for 360 Rotation & Zoom -->
  <div id="interactionLayer" aria-label="Xoay hoa hồng 3D"></div>

  <!-- Minimal Bloom Slider -->
  <div class="slider-bar">
    <span class="text-xs font-medium tracking-wide text-rose-200 whitespace-nowrap">Độ nở:</span>
    <input type="range" id="bloomSlider" min="15" max="100" value="68" />
    <span id="bloomValue" class="text-xs font-semibold text-rose-400 w-9 text-right">68%</span>
  </div>

  <script>
    (function () {
      'use strict';

      function ensureThreeLoaded(callback) {
        if (typeof window.THREE !== 'undefined') {
          callback();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        script.onload = callback;
        document.head.appendChild(script);
      }

      function startApp() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const state = {
          rotationY: 0.4,
          rotationX: 0.46, // Góc nhìn từ trên xuống vừa phải để thấy rõ tâm xoáy hoa hồng
          targetRotationY: 0.4,
          targetRotationX: 0.46,
          cameraZoom: isMobile ? 8.6 : 7.4,
          targetZoom: isMobile ? 8.6 : 7.4,
          bloom: 0.68,
          targetBloom: 0.68,
          isDragging: false,
          lastPointerX: 0,
          lastPointerY: 0,
          pinchDistance: 0,
          time: 0
        };

        // ==========================================
        // 1. THREE.JS 3D SCENE & LIGHTING
        // ==========================================
        const canvas3d = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({
          canvas: canvas3d,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.65 : 2.0));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.55, state.cameraZoom);

        // Ánh sáng tạo chiều sâu rõ rệt giữa các khe cánh xoắn ốc
        const ambientLight = new THREE.AmbientLight(0xffd6dc, 0.58);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xfff0f3, 0x2a0308, 0.55);
        scene.add(hemiLight);

        const mainLight = new THREE.DirectionalLight(0xfff5f5, 1.35);
        mainLight.position.set(3.5, 8.0, 5.0);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.bias = -0.0015;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0xe11d48, 0.75);
        rimLight.position.set(-5.0, 3.0, -4.5);
        scene.add(rimLight);

        const innerGlow = new THREE.PointLight(0xbe123c, 0.6, 4);
        innerGlow.position.set(0, 0.9, 0);
        scene.add(innerGlow);

        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const roseGroup = new THREE.Group();
        rootGroup.add(roseGroup);

        const spiralPetals = [];

        // ==========================================
        // 2. BOTANICAL SPIRAL CUPPED ROSE GEOMETRY
        // ==========================================
        /**
         * Tạo cánh hoa hồng chuẩn tự nhiên:
         * - Bản rộng tròn trịa như vỏ sò, KHÔNG nhọn đầu.
         * - Khum cong chữ U ôm tròn lấy tâm hoa (Cylindrical wrap + Spherical cup).
         * - Mép trên của các lớp cánh ngoài hơi uốn cong nhẹ ra sau (Recurved rose lip).
         * - Chuyển màu đỏ nhung trầm ở đáy lên đỏ thẫm rực rỡ ở thân cánh, tuyệt đối không có đỉnh trắng.
         */
        function createCustomRosePetalGeometry(layerRatio) {
          // layerRatio: 0.0 (lõi xoáy trong cùng) -> 1.0 (cánh lớn ngoài cùng)
          const segW = 24;
          const segH = 22;
          const geo = new THREE.PlaneGeometry(1, 1, segW, segH);
          const pos = geo.attributes.position;
          const colors = new Float32Array(pos.count * 3);
          const tempColor = new THREE.Color();

          // Bảng màu đỏ nhung Hybrid Tea Rose giống ảnh mẫu
          const cDeepBase = new THREE.Color('#3b0006');   // Đỏ đen thẫm dưới đáy tạo bóng sâu
          const cInnerVelvet = new THREE.Color('#8f0718'); // Đỏ nhung trầm
          const cMainRuby = new THREE.Color('#c81025');    // Đỏ tươi chủ đạo của cánh hoa hồng
          const cEdgeScarlet = new THREE.Color('#df1b32'); // Mép cánh bắt sáng nhẹ

          const width = 0.62 + layerRatio * 0.05;
          const height = 0.78 + layerRatio * 0.88;

          // Độ ôm vòng cung ngang (cánh trong cuộn tròn chặt, cánh ngoài mở rộng)
          const wrapArc = (1.0 - layerRatio * 0.42) * Math.PI * 0.76;
          const baseRadius = 0.14 + layerRatio * 0.48;

          for (let i = 0; i < pos.count; i++) {
            const rawX = pos.getX(i); // -0.5 .. 0.5
            const rawY = pos.getY(i); // -0.5 .. 0.5

            const u = rawX * 2.0; // -1 .. 1 (trái qua phải)
            const v = rawY + 0.5; // 0 .. 1 (từ gốc cánh lên mép trên)

            // 1. Hình dáng bản cánh hoa hồng: gốc thu gọn, thân phình tròn rộng, đỉnh bo tròn mềm mại
            const bottomCurve = Math.pow(Math.sin(v * Math.PI * 0.5), 0.52);
            const topRoundness = Math.cos(Math.max(0, (v - 0.68) / 0.32) * Math.PI * 0.48);
            // Mép trên hơi lượn sóng nhẹ đặc trưng của hoa hồng
            const subtleWave = 1.0 + 0.04 * Math.cos(u * Math.PI * 1.5) * Math.pow(v, 2);
            const profileW = bottomCurve * (0.35 + 0.65 * topRoundness) * subtleWave;

            // Góc ôm quanh trục bông hoa
            const theta = u * profileW * (wrapArc * 0.5);

            // 2. Độ khum sâu vào lòng hoa (Cupping curve)
            // Cánh hoa đứng khum vào trong ở phần thân và chỉ hơi uốn ngửa mép trên cùng
            const verticalCup = Math.sin(v * Math.PI * 0.88) * (0.22 + layerRatio * 0.24);

            // Độ uốn ngược mép cánh trên (Recurved lip) giống ảnh thật
            const lipStart = 0.66;
            let lipCurl = 0;
            if (v > lipStart && layerRatio > 0.12) {
              const tLip = (v - lipStart) / (1.0 - lipStart);
              // Hai bên mép trên uốn nhẹ ra sau nhiều hơn chính giữa một chút tạo dáng cánh hồng duyên dáng
              const cornerFactor = 0.65 + 0.65 * Math.pow(Math.abs(u), 1.4);
              lipCurl = Math.pow(tLip, 2.1) * (0.14 + layerRatio * 0.32) * cornerFactor;
            }

            // Bán kính tại điểm (u, v) trên mặt trụ-cầu đồng tâm
            const localR = baseRadius + verticalCup + lipCurl;

            // Chuyển sang tọa độ 3D tính từ khớp xoay ở gốc cánh
            const x = Math.sin(theta) * localR * (width / 0.85);
            const y = v * height - (lipCurl * 0.22);
            const z = (Math.cos(theta) * localR - baseRadius) + verticalCup * 0.55 - lipCurl;

            pos.setXYZ(i, x, y, z);

            // 3. Phối màu nhung đỏ tự nhiên, có chiều sâu ở đáy và khe cánh
            const edgeDarken = Math.pow(Math.abs(u), 2.8) * 0.12;
            if (v < 0.25) {
              tempColor.lerpColors(cDeepBase, cInnerVelvet, v / 0.25);
            } else if (v < 0.78) {
              tempColor.lerpColors(cInnerVelvet, cMainRuby, (v - 0.25) / 0.53);
            } else {
              tempColor.lerpColors(cMainRuby, cEdgeScarlet, (v - 0.78) / 0.22);
            }
            tempColor.offsetHSL(0, 0, -edgeDarken * 0.5 - (1.0 - layerRatio) * 0.04);

            colors[i * 3] = tempColor.r;
            colors[i * 3 + 1] = tempColor.g;
            colors[i * 3 + 2] = tempColor.b;
          }

          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geo.computeVertexNormals();
          return geo;
        }

        function buildRealisticSpiralRose() {
          const headGroup = new THREE.Group();
          headGroup.position.set(0, 0.45, 0);

          const petalMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.68, // Chất liệu nhung mịn (matte velvet)
            metalness: 0.04,
            side: THREE.DoubleSide
          });

          // Lõi nụ xoáy sâu ở tâm hoa hồng
          const coreGeo = new THREE.CylinderGeometry(0.05, 0.14, 0.55, 16);
          const coreMat = new THREE.MeshStandardMaterial({
            color: 0x4a020a,
            roughness: 0.75
          });
          const coreMesh = new THREE.Mesh(coreGeo, coreMat);
          coreMesh.position.y = 0.28;
          headGroup.add(coreMesh);

          // Xếp 26 cánh theo đúng quy luật Xoắn ốc Tỷ lệ vàng (Phyllotaxis Golden Angle = 137.508 độ)
          // Giúp các cánh xen kẽ ôm chồng lên nhau tự nhiên như hoa hồng thật
          const totalPetals = 26;
          const goldenAngle = 137.508 * (Math.PI / 180);

          for (let i = 0; i < totalPetals; i++) {
            const t = i / (totalPetals - 1); // 0.0 -> 1.0
            const petalGeo = createCustomRosePetalGeometry(t);

            const angle = i * goldenAngle;
            // Bán kính chân cánh tăng dần theo đường xoắn ốc
            const radius = 0.05 + Math.pow(t, 1.08) * 0.34;
            // Độ cao chân cánh hạ dần ở các vòng ngoài để ôm lấy bầu hoa
            const yOffset = 0.14 - t * 0.24;

            const holder = new THREE.Group();
            holder.rotation.y = angle;

            const pivot = new THREE.Group();
            pivot.position.set(0, yOffset, radius);

            // Góc khum khi còn chúm nụ vs khi nở bung:
            // Lõi trong (t nhỏ) luôn giữ độ khum xoáy chặt, lớp ngoài mở dần theo thanh trượt Độ nở
            const closedTilt = -0.32 + t * 0.22;
            const openDelta = 0.12 + Math.pow(t, 1.35) * 0.88;

            const mesh = new THREE.Mesh(petalGeo, petalMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            pivot.add(mesh);
            holder.add(pivot);
            headGroup.add(holder);

            spiralPetals.push({
              pivot,
              closedTilt,
              openDelta,
              layerRatio: t,
              phase: i * 0.6
            });
          }

          // Đài hoa xanh (Bầu hoa + 5 lá đài thon dài dưới đáy bông hồng)
          const receptacleGeo = new THREE.SphereGeometry(0.34, 18, 14);
          receptacleGeo.scale(1.0, 0.85, 1.0);
          const greenMat = new THREE.MeshStandardMaterial({
            color: 0x265c28,
            roughness: 0.58,
            side: THREE.DoubleSide
          });
          const receptacle = new THREE.Mesh(receptacleGeo, greenMat);
          receptacle.position.set(0, -0.18, 0);
          headGroup.add(receptacle);

          // 5 lá đài xanh dưới đế hoa
          for (let i = 0; i < 5; i++) {
            const sepalGeo = new THREE.PlaneGeometry(0.26, 0.85, 8, 12);
            const sPos = sepalGeo.attributes.position;
            for (let j = 0; j < sPos.count; j++) {
              const sx = sPos.getX(j);
              const sy = sPos.getY(j);
              const sv = sy + 0.5;
              const widthFactor = Math.sin(Math.pow(1.0 - sv, 0.7) * Math.PI);
              sPos.setXYZ(
                j,
                sx * widthFactor,
                sv * 0.85,
                Math.sin(sv * Math.PI) * 0.12 - Math.pow(sv, 2) * 0.22
              );
            }
            sepalGeo.computeVertexNormals();

            const sHolder = new THREE.Group();
            sHolder.rotation.y = (i / 5) * Math.PI * 2 + 0.2;
            const sPivot = new THREE.Group();
            sPivot.position.set(0, -0.18, 0.25);
            sPivot.rotation.x = 1.95;

            const sMesh = new THREE.Mesh(sepalGeo, greenMat);
            sPivot.add(sMesh);
            sHolder.add(sPivot);
            headGroup.add(sHolder);
          }

          // Thân cây hoa hồng cong tự nhiên
          const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.22, 0),
            new THREE.Vector3(0.04, -1.15, 0.03),
            new THREE.Vector3(-0.03, -2.2, -0.02),
            new THREE.Vector3(0.01, -3.5, 0)
          ]);
          const stemGeo = new THREE.TubeGeometry(stemCurve, 28, 0.068, 12, false);
          const stemMesh = new THREE.Mesh(stemGeo, greenMat);
          headGroup.add(stemMesh);

          // Lá hoa hồng hình bầu dục có gân và răng cưa nhẹ
          function createRoseLeafletGeometry() {
            const lGeo = new THREE.PlaneGeometry(0.58, 0.92, 14, 16);
            const lPos = lGeo.attributes.position;
            const lColors = new Float32Array(lPos.count * 3);
            const cLeafDark = new THREE.Color('#19421b');
            const cLeafMid = new THREE.Color('#2d6a30');
            const cLeafLight = new THREE.Color('#3f8542');
            const tmpC = new THREE.Color();

            for (let i = 0; i < lPos.count; i++) {
              const lx = lPos.getX(i);
              const ly = lPos.getY(i);
              const lu = lx / 0.29;
              const lv = ly + 0.5;

              const baseProfile = Math.sin(Math.pow(lv, 0.75) * Math.PI);
              const serration = 1.0 + 0.045 * Math.sin(lv * Math.PI * 12) * Math.abs(lu);
              const x = lx * baseProfile * serration;
              const y = lv * 0.92;
              const z = Math.abs(lu) * 0.06 - Math.pow(lv, 2.0) * 0.16;

              lPos.setXYZ(i, x, y, z);

              if (Math.abs(lu) < 0.12) {
                tmpC.copy(cLeafLight);
              } else {
                tmpC.lerpColors(cLeafDark, cLeafMid, lv);
              }
              lColors[i * 3] = tmpC.r;
              lColors[i * 3 + 1] = tmpC.g;
              lColors[i * 3 + 2] = tmpC.b;
            }
            lGeo.setAttribute('color', new THREE.BufferAttribute(lColors, 3));
            lGeo.computeVertexNormals();
            return lGeo;
          }

          const leafletGeo = createRoseLeafletGeometry();
          const leafMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.45,
            metalness: 0.05,
            side: THREE.DoubleSide
          });

          // Cành lá kép 3 lá chét giống ảnh thật
          const branchConfigs = [
            { y: -1.05, rotY: 0.85, tilt: 1.15, scale: 0.88 },
            { y: -1.75, rotY: 3.85, tilt: 1.2, scale: 0.96 }
          ];

          branchConfigs.forEach((cfg) => {
            const branchHolder = new THREE.Group();
            branchHolder.position.set(0, cfg.y, 0);
            branchHolder.rotation.y = cfg.rotY;

            const branchPivot = new THREE.Group();
            branchPivot.position.set(0, 0, 0.06);
            branchPivot.rotation.x = cfg.tilt;
            branchPivot.scale.setScalar(cfg.scale);

            // Lá chính giữa
            const centerLeaf = new THREE.Mesh(leafletGeo, leafMat);
            centerLeaf.position.set(0, 0.25, 0);
            branchPivot.add(centerLeaf);

            // 2 lá chét hai bên
            const leftLeaf = new THREE.Mesh(leafletGeo, leafMat);
            leftLeaf.scale.setScalar(0.72);
            leftLeaf.position.set(-0.12, 0.08, 0.02);
            leftLeaf.rotation.z = 0.85;
            branchPivot.add(leftLeaf);

            const rightLeaf = new THREE.Mesh(leafletGeo, leafMat);
            rightLeaf.scale.setScalar(0.72);
            rightLeaf.position.set(0.12, 0.08, 0.02);
            rightLeaf.rotation.z = -0.85;
            branchPivot.add(rightLeaf);

            branchHolder.add(branchPivot);
            headGroup.add(branchHolder);
          });

          roseGroup.add(headGroup);
        }

        buildRealisticSpiralRose();

        // ==========================================
        // 3. 2D FALLING ROSE PETALS & BOKEH OVERLAY
        // ==========================================
        const canvas2d = document.getElementById('canvas2d');
        const ctx = canvas2d.getContext('2d');
        let cw = window.innerWidth;
        let ch = window.innerHeight;

        function resize2D() {
          cw = window.innerWidth;
          ch = window.innerHeight;
          canvas2d.width = cw;
          canvas2d.height = ch;
        }
        resize2D();

        const fallingPetals2D = [];
        const petalCount2D = isMobile ? 16 : 26;
        const palette2D = ['#9f1239', '#be123c', '#e11d48', '#881337'];

        for (let i = 0; i < petalCount2D; i++) {
          fallingPetals2D.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            size: (isMobile ? 9 : 12) + Math.random() * 10,
            speedY: 0.55 + Math.random() * 0.85,
            speedX: -0.35 + Math.random() * 0.7,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.025,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 0.02 + Math.random() * 0.03,
            color: palette2D[i % palette2D.length],
            alpha: 0.45 + Math.random() * 0.4
          });
        }

        function render2DPetals() {
          ctx.clearRect(0, 0, cw, ch);

          for (let i = 0; i < fallingPetals2D.length; i++) {
            const p = fallingPetals2D[i];
            p.y += p.speedY;
            p.x += p.speedX + Math.sin(state.time * 1.1 + i) * 0.35;
            p.angle += p.spin;
            p.flipPhase += p.flipSpeed;

            if (p.y > ch + 30) {
              p.y = -25;
              p.x = Math.random() * cw;
            }
            if (p.x > cw + 30) p.x = -25;
            if (p.x < -30) p.x = cw + 25;

            const flipScale = 0.45 + 0.55 * Math.abs(Math.cos(p.flipPhase));

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.scale(1, flipScale);
            ctx.globalAlpha = p.alpha;

            // Vẽ cánh hoa hồng tròn khum 2D
            const r = p.size;
            const grad = ctx.createRadialGradient(0, -r * 0.2, r * 0.1, 0, 0, r);
            grad.addColorStop(0, p.color);
            grad.addColorStop(1, '#4c0519');
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, r * 0.65);
            ctx.bezierCurveTo(-r * 0.95, r * 0.35, -r * 0.9, -r * 0.75, 0, -r * 0.65);
            ctx.bezierCurveTo(r * 0.9, -r * 0.75, r * 0.95, r * 0.35, 0, r * 0.65);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
          }
        }

        // ==========================================
        // 4. ANIMATION LOOP & INTERACTION
        // ==========================================
        function animate() {
          requestAnimationFrame(animate);

          state.time += 0.016;

          if (!state.isDragging) {
            state.targetRotationY += 0.0032;
          }

          state.rotationY += (state.targetRotationY - state.rotationY) * 0.09;
          state.rotationX += (state.targetRotationX - state.rotationX) * 0.09;
          state.cameraZoom += (state.targetZoom - state.cameraZoom) * 0.09;
          state.bloom += (state.targetBloom - state.bloom) * 0.1;

          rootGroup.rotation.y = state.rotationY;
          rootGroup.rotation.x = state.rotationX;
          rootGroup.position.y = Math.sin(state.time * 1.2) * 0.035;
          camera.position.z = state.cameraZoom;

          // Cập nhật độ mở của từng lớp cánh xoắn ốc
          for (let i = 0; i < spiralPetals.length; i++) {
            const sp = spiralPetals[i];
            const breeze = Math.sin(state.time * 1.5 + sp.phase) * 0.012 * sp.layerRatio;
            sp.pivot.rotation.x = sp.closedTilt + state.bloom * sp.openDelta + breeze;
          }

          renderer.render(scene, camera);
          render2DPetals();
        }

        // Thanh kéo chỉnh độ nở hoa
        const bloomSlider = document.getElementById('bloomSlider');
        const bloomValue = document.getElementById('bloomValue');
        bloomSlider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value, 10);
          state.targetBloom = val / 100;
          bloomValue.textContent = val + '%';
        });

        // Xoay 3D & Phóng to/Thu nhỏ
        const interactionLayer = document.getElementById('interactionLayer');

        interactionLayer.addEventListener('pointerdown', (e) => {
          state.isDragging = true;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
          if (!state.isDragging) return;
          const dx = e.clientX - state.lastPointerX;
          const dy = e.clientY - state.lastPointerY;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;

          state.targetRotationY += dx * 0.0075;
          state.targetRotationX = Math.max(-0.25, Math.min(1.15, state.targetRotationX + dy * 0.006));
        });

        window.addEventListener('pointerup', () => {
          state.isDragging = false;
        });

        interactionLayer.addEventListener('wheel', (e) => {
          e.preventDefault();
          state.targetZoom = Math.max(4.8, Math.min(11.5, state.targetZoom + e.deltaY * 0.0035));
        }, { passive: false });

        interactionLayer.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            state.pinchDistance = Math.hypot(dx, dy);
          }
        }, { passive: true });

        interactionLayer.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && state.pinchDistance > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = state.pinchDistance - dist;
            state.targetZoom = Math.max(4.8, Math.min(11.5, state.targetZoom + delta * 0.016));
            state.pinchDistance = dist;
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          resize2D();
        });

        requestAnimationFrame(animate);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => ensureThreeLoaded(startApp));
      } else {
        ensureThreeLoaded(startApp);
      }
    })();
  </script>
</body>
