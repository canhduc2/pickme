<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hiệu Ứng Hoa Hồng 3D</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 40%, #1a080c 0%, #050203 100%);
      touch-action: none;
    }
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #interactionLayer {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: grab;
    }
    #interactionLayer:active {
      cursor: grabbing;
    }
    .slider-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 10, 12, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.25);
      padding: 10px 20px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 130px;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #fb7185;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(251, 113, 133, 0.8);
    }
  </style>
</head>
<body class="text-rose-100 relative select-none">

  <!-- 3D WebGL Rose Canvas -->
  <canvas id="canvas3d"></canvas>

  <!-- Touch & Mouse Gesture Layer for 3D rotation and zoom -->
  <div id="interactionLayer" aria-label="Xoay hoa hồng 3D"></div>

  <!-- Sleek Bloom Control Slider -->
  <div class="slider-container">
    <span class="text-xs font-medium tracking-wide text-rose-200">Độ nở hoa:</span>
    <input type="range" id="bloomSlider" min="0" max="100" value="75" />
    <span id="bloomVal" class="text-xs font-semibold text-rose-400 w-8 text-right">75%</span>
  </div>

  <script>
    (function () {
      'use strict';

      function ensureThreeLoaded(callback) {
        if (typeof window.THREE !== 'undefined') {
          callback();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        script.onload = callback;
        document.head.appendChild(script);
      }

      function startApp() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const state = {
          rotationY: 0,
          rotationX: 0.35,
          targetRotationY: 0,
          targetRotationX: 0.35,
          cameraZoom: isMobile ? 8.5 : 7.2,
          targetZoom: isMobile ? 8.5 : 7.2,
          bloomFactor: 0.75,
          isDragging: false,
          lastPointerX: 0,
          lastPointerY: 0,
          pinchDistance: 0,
          time: 0
        };

        const canvas3d = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({
          canvas: canvas3d,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2.0));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.8, state.cameraZoom);

        // Soft studio lighting tuned for velvet red rose petals
        const ambientLight = new THREE.AmbientLight(0xffe4e6, 0.8);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff1f2, 1.4);
        keyLight.position.set(3, 7, 5);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xf43f5e, 0.65);
        fillLight.position.set(-4, 2, -3);
        scene.add(fillLight);

        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const roseGroup = new THREE.Group();
        rootGroup.add(roseGroup);

        const petalsData = [];

        // Create classic rounded cupped rose petal with inward curling tip
        function createRosePetalGeometry(isRoseHeadPetal = false) {
          const width = 0.9;
          const length = 1.1;
          const segW = 16;
          const segL = 20;
          const geo = new THREE.PlaneGeometry(width, length, segW, segL);
          const pos = geo.attributes.position;
          const colors = new Float32Array(pos.count * 3);
          const tempColor = new THREE.Color();

          const cBase = new THREE.Color('#881337'); // Deep dark velvety crimson at base
          const cMid = new THREE.Color('#e11d48');  // Rich rose red
          const cTip = new THREE.Color('#fb7185');  // Soft romantic pinkish red edge

          for (let i = 0; i < pos.count; i++) {
            const rawX = pos.getX(i);
            const rawY = pos.getY(i);

            const u = rawX / (width * 0.5); // -1 to 1
            const v = Math.max(0.0, Math.min(1.0, (rawY + length * 0.5) / length)); // 0 (base) to 1 (tip)

            // Head petals widen from a narrow base into a broad, softly scalloped edge.
            const widthProfile = isRoseHeadPetal
              ? 0.08 + 0.92 * Math.sin(Math.pow(v, 0.72) * Math.PI * 0.5)
              : Math.sin(v * Math.PI * 0.85) * (1.0 - 0.2 * Math.pow(u, 4));
            const x = rawX * widthProfile;
            const topEdge = isRoseHeadPetal
              ? 0.11 * Math.pow(Math.abs(u), 2) * Math.pow(v, 6) +
                0.025 * Math.exp(-Math.pow(u / 0.18, 2)) * Math.pow(v, 8)
              : 0;
            const y = v * length - topEdge;

            // Head petals curve outward toward the viewer instead of folding into the bloom.
            const cupShape = isRoseHeadPetal
              ? 0.48 * (1.0 - u * u) * Math.sin(v * Math.PI * 0.78)
              : 0.35 * (1.0 - u * u) * Math.sin(v * Math.PI * 0.9);
            const inwardTip = Math.pow(v, isRoseHeadPetal ? 3 : 2.5) * (isRoseHeadPetal ? 0.2 : -0.22);
            const sideFold = Math.pow(Math.abs(u), 3.0) * (isRoseHeadPetal ? 0.2 : 0.15);
            const z = cupShape + inwardTip + sideFold;

            pos.setXYZ(i, x, y, z);

            // Rich velvety gradient coloring
            if (v < 0.35) {
              tempColor.lerpColors(cBase, cMid, v / 0.35);
            } else {
              tempColor.lerpColors(cMid, cTip, (v - 0.35) / 0.65);
            }

            colors[i * 3] = tempColor.r;
            colors[i * 3 + 1] = tempColor.g;
            colors[i * 3 + 2] = tempColor.b;
          }

          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geo.computeVertexNormals();
          return geo;
        }

        function buildRose() {
          const headGroup = new THREE.Group();
          headGroup.position.set(0, 0.4, 0);

          const petalGeo = createRosePetalGeometry(true);
          const petalMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.45,
            metalness: 0.05,
            side: THREE.DoubleSide
          });

          // Concentric rose whorls (Whorl 1: Inner bud core tightly cupped; Whorl 2: Mid overlapping petals; Whorl 3: Outer protective petals)
          const whorls = [
            { count: 7, radius: 0.01, y: 0.01, baseTilt: 0.35, openSpeed: 0.4, scale: 0.58 },
            { count: 9, radius: 0.035, y: 0, baseTilt: 0.75, openSpeed: 0.8, scale: 0.86 },
            { count: 12, radius: 0.065, y: -0.01, baseTilt: 1.15, openSpeed: 1.2, scale: 1.08 }
          ];

          whorls.forEach((w, wIdx) => {
            for (let i = 0; i < w.count; i++) {
              const angle = (i / w.count) * Math.PI * 2 + (wIdx * 0.35);

              const radialHolder = new THREE.Group();
              radialHolder.rotation.y = angle;

              const pivot = new THREE.Group();
              pivot.position.set(0, w.y, w.radius);
              pivot.rotation.x = w.baseTilt;

              const mesh = new THREE.Mesh(petalGeo, petalMat);
              mesh.scale.setScalar(w.scale);
              pivot.add(mesh);

              radialHolder.add(pivot);
              headGroup.add(radialHolder);

              petalsData.push({
                pivot,
                baseTilt: w.baseTilt,
                openSpeed: w.openSpeed,
                phase: i * 0.5 + wIdx
              });
            }
          });

          // Green sepal base (đài hoa xanh ôm lấy đáy búp hoa)
          const sepalGroup = new THREE.Group();
          sepalGroup.position.set(0, -0.18, 0);
          const sepalGeo = createRosePetalGeometry();
          const sepalMat = new THREE.MeshStandardMaterial({
            color: 0x15803d,
            roughness: 0.5,
            side: THREE.DoubleSide
          });

          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const holder = new THREE.Group();
            holder.rotation.y = angle;
            const pivot = new THREE.Group();
            pivot.position.set(0, 0, 0.35);
            pivot.rotation.x = 1.4;
            const mesh = new THREE.Mesh(sepalGeo, sepalMat);
            mesh.scale.set(0.5, 0.4, 0.5);
            pivot.add(mesh);
            holder.add(pivot);
            sepalGroup.add(holder);
          }
          headGroup.add(sepalGroup);

          // Elegant rose stem with thorns and leaves
          const stemMat = new THREE.MeshStandardMaterial({
            color: 0x166534,
            roughness: 0.6
          });
          const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.15, 0),
            new THREE.Vector3(0.03, -1.0, 0.02),
            new THREE.Vector3(-0.02, -2.0, -0.01),
            new THREE.Vector3(0, -3.2, 0)
          ]);
          const stemGeo = new THREE.TubeGeometry(curve, 24, 0.055, 12, false);
          const stemMesh = new THREE.Mesh(stemGeo, stemMat);
          headGroup.add(stemMesh);

          // Rose leaves pairs on stem
          const leafMat = new THREE.MeshStandardMaterial({
            color: 0x15803d,
            roughness: 0.45,
            side: THREE.DoubleSide
          });
          const leafGeo = createRosePetalGeometry();

          const leafPairs = [
            { y: -1.0, angle: 1.2, scale: 0.65 },
            { y: -2.1, angle: 4.2, scale: 0.75 }
          ];

          leafPairs.forEach(lf => {
            const holder = new THREE.Group();
            holder.position.set(0, lf.y, 0);
            holder.rotation.y = lf.angle;
            const pivot = new THREE.Group();
            pivot.position.set(0, 0, 0.04);
            pivot.rotation.x = 1.0;
            const mesh = new THREE.Mesh(leafGeo, leafMat);
            mesh.scale.setScalar(lf.scale);
            pivot.add(mesh);
            holder.add(pivot);
            headGroup.add(holder);
          });

          roseGroup.add(headGroup);
        }

        buildRose();

        // Floating falling rose petals in background
        const fallingPetalsGroup = new THREE.Group();
        rootGroup.add(fallingPetalsGroup);
        const fallingPetals = [];

        function initFallingPetals() {
          const count = isMobile ? 18 : 30;
          const geo = createRosePetalGeometry();
          const mat = new THREE.MeshStandardMaterial({
            color: 0xf43f5e,
            roughness: 0.5,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
          });

          for (let i = 0; i < count; i++) {
            const mesh = new THREE.Mesh(geo, mat);
            const scale = 0.2 + Math.random() * 0.25;
            mesh.scale.setScalar(scale);

            const angle = Math.random() * Math.PI * 2;
            const radius = 1.5 + Math.random() * 2.5;
            const y = -2.0 + Math.random() * 5.0;

            mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

            fallingPetalsGroup.add(mesh);
            fallingPetals.push({
              mesh,
              angle,
              radius,
              baseY: y,
              speedY: 0.4 + Math.random() * 0.4,
              rotSpeedX: (Math.random() - 0.5) * 1.5,
              rotSpeedY: (Math.random() - 0.5) * 1.5,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
        initFallingPetals();

        function animate() {
          requestAnimationFrame(animate);

          state.time += 0.016;

          if (!state.isDragging) {
            state.targetRotationY += 0.0035;
          }
          state.rotationY += (state.targetRotationY - state.rotationY) * 0.1;
          state.rotationX += (state.targetRotationX - state.rotationX) * 0.1;
          state.cameraZoom += (state.targetZoom - state.cameraZoom) * 0.1;

          rootGroup.rotation.y = state.rotationY;
          rootGroup.rotation.x = state.rotationX;
          rootGroup.position.y = Math.sin(state.time * 1.2) * 0.04;
          camera.position.z = state.cameraZoom;

          // Update petal blooming according to slider factor
          for (let i = 0; i < petalsData.length; i++) {
            const p = petalsData[i];
            const bloomBoost = state.bloomFactor * 0.65;
            const breeze = Math.sin(state.time * 1.4 + p.phase) * 0.018;
            p.pivot.rotation.x = p.baseTilt + (bloomBoost * p.openSpeed) + breeze;
          }

          // Update falling background petals
          for (let i = 0; i < fallingPetals.length; i++) {
            const fp = fallingPetals[i];
            fp.mesh.position.y -= fp.speedY * 0.016;
            fp.mesh.rotation.x += fp.rotSpeedX * 0.016;
            fp.mesh.rotation.y += fp.rotSpeedY * 0.016;

            const swayAngle = fp.angle + Math.sin(state.time * 0.8 + fp.phase) * 0.5;
            fp.mesh.position.x = Math.cos(swayAngle) * fp.radius;
            fp.mesh.position.z = Math.sin(swayAngle) * fp.radius;

            if (fp.mesh.position.y < -3.0) {
              fp.mesh.position.y = 3.0;
            }
          }

          renderer.render(scene, camera);
        }

        // Slider control event
        const bloomSlider = document.getElementById('bloomSlider');
        const bloomVal = document.getElementById('bloomVal');
        bloomSlider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value);
          state.bloomFactor = val / 100;
          bloomVal.textContent = val + '%';
        });

        // Touch & Mouse Interaction
        const interactionLayer = document.getElementById('interactionLayer');

        interactionLayer.addEventListener('pointerdown', (e) => {
          state.isDragging = true;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
          if (!state.isDragging) return;
          const dx = e.clientX - state.lastPointerX;
          const dy = e.clientY - state.lastPointerY;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;

          state.targetRotationY += dx * 0.008;
          state.targetRotationX = Math.max(-0.4, Math.min(0.9, state.targetRotationX + dy * 0.006));
        });

        window.addEventListener('pointerup', () => {
          state.isDragging = false;
        });

        interactionLayer.addEventListener('wheel', (e) => {
          e.preventDefault();
          state.targetZoom = Math.max(5.0, Math.min(11.0, state.targetZoom + e.deltaY * 0.003));
        }, { passive: false });

        interactionLayer.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            state.pinchDistance = Math.hypot(dx, dy);
          }
        }, { passive: true });

        interactionLayer.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && state.pinchDistance > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = state.pinchDistance - dist;
            state.targetZoom = Math.max(5.0, Math.min(11.0, state.targetZoom + delta * 0.015));
            state.pinchDistance = dist;
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => ensureThreeLoaded(startApp));
      } else {
        ensureThreeLoaded(startApp);
      }
    })();
  </script>
</body>
</html>
